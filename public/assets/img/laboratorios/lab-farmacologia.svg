<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pharm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="fluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-pharm)" />

  <!-- Lab bench grid lines -->
  <path d="M0 320 L800 320 M0 360 L800 360 M0 400 L800 400" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <rect x="0" y="310" width="800" height="140" fill="rgba(15, 23, 42, 0.6)" />

  <!-- Back Wall Shelves with Reagent Bottles -->
  <rect x="60" y="80" width="680" height="8" rx="4" fill="rgba(255,255,255,0.25)" />
  <rect x="60" y="150" width="680" height="8" rx="4" fill="rgba(255,255,255,0.25)" />

  <!-- Reagent bottles on shelf 1 -->
  <g transform="translate(100, 40)">
    <rect x="0" y="10" width="22" height="30" rx="3" fill="#a855f7" opacity="0.8" />
    <rect x="6" y="2" width="10" height="8" fill="#e9d5ff" />
    <rect x="35" y="5" width="26" height="35" rx="3" fill="#38bdf8" opacity="0.7" />
    <rect x="42" y="-3" width="12" height="8" fill="#e0f2fe" />
    <rect x="75" y="15" width="20" height="25" rx="3" fill="#34d399" opacity="0.8" />
    <rect x="80" y="7" width="10" height="8" fill="#d1fae5" />
    <rect x="110" y="0" width="30" height="40" rx="4" fill="#fbbf24" opacity="0.75" />
    <rect x="118" y="-8" width="14" height="8" fill="#fef3c7" />
  </g>

  <!-- Microscope (Center Left) -->
  <g transform="translate(140, 160)">
    <!-- Base -->
    <path d="M20 150 L140 150 L130 135 L30 135 Z" fill="#334155" />
    <rect x="30" y="145" width="100" height="6" rx="2" fill="#64748b" />
    <!-- Arm -->
    <path d="M110 135 C140 100 130 30 70 30 L60 30 L60 50 L70 50 C100 50 110 90 90 135 Z" fill="#cbd5e1" />
    <!-- Stage -->
    <rect x="40" y="90" width="60" height="8" rx="2" fill="#0f172a" />
    <rect x="65" y="86" width="12" height="4" fill="#38bdf8" />
    <!-- Objective lenses & Revolving nosepiece -->
    <circle cx="70" cy="55" r="14" fill="#64748b" />
    <rect x="65" y="65" width="10" height="18" fill="#e2e8f0" />
    <rect x="52" y="62" width="8" height="14" transform="rotate(25 52 62)" fill="#94a3b8" />
    <!-- Eyepiece Tube & Lens -->
    <rect x="40" y="0" width="12" height="35" transform="rotate(-30 40 0)" fill="#475569" />
    <rect x="25" y="-12" width="18" height="12" rx="3" transform="rotate(-30 25 -12)" fill="#1e293b" />
    <!-- Focus knob -->
    <circle cx="105" cy="100" r="10" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Test Tubes Rack & Flasks (Center Right) -->
  <g transform="translate(380, 200)">
    <!-- Flask -->
    <path d="M40 0 L55 0 L55 35 L85 95 C90 105 80 115 65 115 L30 115 C15 115 5 105 10 95 L40 35 Z" fill="rgba(255,255,255,0.25)" stroke="#e9d5ff" stroke-width="2"/>
    <!-- Liquid in flask -->
    <path d="M18 90 L77 90 C80 97 75 112 65 112 L30 112 C20 112 15 97 18 90 Z" fill="url(#fluid)"/>
    <!-- Bubbles -->
    <circle cx="45" cy="80" r="4" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="55" cy="65" r="3" fill="#e9d5ff" opacity="0.6"/>
    <circle cx="40" cy="50" r="2.5" fill="#e9d5ff" opacity="0.7"/>

    <!-- Test Tube Rack -->
    <g transform="translate(110, 25)">
      <rect x="0" y="65" width="140" height="6" fill="#64748b"/>
      <rect x="0" y="25" width="140" height="6" fill="#64748b"/>
      <rect x="5" y="25" width="8" height="70" fill="#475569"/>
      <rect x="127" y="25" width="8" height="70" fill="#475569"/>
      <!-- Tube 1 (Red/Pink) -->
      <rect x="25" y="0" width="16" height="85" rx="8" fill="rgba(255,255,255,0.2)" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="27" y="35" width="12" height="47" rx="6" fill="#f43f5e"/>
      <!-- Tube 2 (Blue/Cyan) -->
      <rect x="52" y="-10" width="16" height="95" rx="8" fill="rgba(255,255,255,0.2)" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="54" y="20" width="12" height="62" rx="6" fill="#06b6d4"/>
      <!-- Tube 3 (Yellow/Amber) -->
      <rect x="79" y="5" width="16" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="#eab308" stroke-width="1.5"/>
      <rect x="81" y="45" width="12" height="37" rx="6" fill="#eab308"/>
      <!-- Tube 4 (Purple) -->
      <rect x="106" y="-5" width="16" height="90" rx="8" fill="rgba(255,255,255,0.2)" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="108" y="30" width="12" height="52" rx="6" fill="#a855f7"/>
    </g>
  </g>

  <!-- Digital Spectrophotometer Analyzer -->
  <g transform="translate(620, 220)">
    <rect x="0" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="15" y="15" width="70" height="35" rx="4" fill="#0f172a"/>
    <text x="22" y="38" font-family="monospace" font-size="14" fill="#38bdf8" font-weight="700">0.482 A</text>
    <circle cx="105" cy="25" r="6" fill="#22c55e"/>
    <circle cx="120" cy="25" r="6" fill="#eab308"/>
    <rect x="15" y="60" width="110" height="20" rx="4" fill="#334155"/>
  </g>

  <!-- Header Badge -->
  <rect x="40" y="30" width="370" height="50" rx="25" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)"/>
  <text x="65" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#c084fc">💊 FARMACOLOGIA E ANÁLISES CLÍNICAS</text>

  <!-- Bottom Info Bar -->
  <rect x="40" y="375" width="720" height="50" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <text x="60" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">
    ISPOTEC · Bioquímica · Hematologia · Farmacologia Clínica · Espectrofotometria · Reagentes
  </text>
</svg>